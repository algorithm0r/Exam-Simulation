<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>ExamSim</title>
    <link rel="stylesheet" type="text/css" href="./style.css"></link>
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.1/socket.io.js"></script>
    <script type="text/javascript" src="./assetmanager.js"></script>
    <script type="text/javascript" src="./histogram.js"></script>
    <script type="text/javascript" src="./graph.js"></script>
    <script type="text/javascript" src="./gameengine.js"></script>
    <script type="text/javascript" src="./util.js"></script>
    <script type="text/javascript" src="./student.js"></script>
    <script type="text/javascript" src="./invigilator.js"></script>
    <script type="text/javascript" src="./datamanager.js"></script>
    <script type="text/javascript" src="./main.js"></script>
</head>
<body>
    <canvas id="gameWorld" width="1600" height="800"></canvas>
    <br>
    <div id="db" class="db-status">Database</div><br />

    <div id="controls">
        <label for="histView"><strong>Histogram view:</strong></label>
        <select id="histView">
            <option value="0">Simple Sum</option>
            <option value="1" selected>Stack by Trait Count</option>
            <option value="2">Stack by Ambition</option>
            <option value="3">Stack by Confidence</option>
            <option value="4">Stack by Focus</option>
            <option value="5">Stack by GuessAllRemaining</option>
            <option value="6">Stack by Endurance</option>
            <option value="7">Stack by Exam Order</option>
        </select>
        &nbsp;&nbsp;
        <button type="button" onclick="reset()">Reset</button>
        &nbsp;
        <button type="button" onclick="dload()">Download</button>
        &nbsp;&nbsp;
        <input type="checkbox" id="graphs" checked/> Draw Graphs &nbsp;
        <input type="checkbox" id="visuals" checked/> Draw Simulation
    </div>
    <br />

    <div id="traitKey">
        <strong>Trait bit order:</strong>
        <span id="traitLabels"></span>
    </div>

    <script>
        // Render trait bit order key once PARAMS is loaded
        window.addEventListener('load', function() {
            if (typeof PARAMS !== 'undefined' && PARAMS.traits) {
                const labels = PARAMS.traits.map((t, i) => i + ":" + t.name).join(" &nbsp;|&nbsp; ");
                document.getElementById('traitLabels').innerHTML = "&nbsp;" + labels;
            }
        });
    </script>
</body>
</html>
